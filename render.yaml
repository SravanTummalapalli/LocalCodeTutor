services:
  - type: web
    name: python-rag-chatbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: PDF_PATH
        value: data/Fluent_Python_by_Luciano_Ramalho.pdf
    disk:
      name: vector-store
      mountPath: /opt/render/project/src/vector_store
      sizeGB: 1